<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" width="400" height="568">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c5c"/>
      <stop offset="50%" stop-color="#500d2e"/>
      <stop offset="100%" stop-color="#1f0310"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="568" fill="url(#bgComp)"/>

  <!-- Left Spine Shadow Crease -->
  <rect x="0" y="0" width="18" height="568" fill="black" opacity="0.25"/>
  <line x1="18" y1="0" x2="18" y2="568" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Magazine Banner Header -->
  <rect x="25" y="24" width="350" height="42" fill="#721835" rx="4"/>
  <text x="200" y="44" fill="#ffffff" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3" text-anchor="middle">TEXTILES COMMITTEE MAGAZINE</text>
  <text x="200" y="58" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans', Arial, sans-serif" font-size="9" text-anchor="middle">MINISTRY OF TEXTILES • GOVT. OF INDIA</text>

  <!-- Big Magazine Masthead -->
  <text x="200" y="125" fill="#38bdf8" font-family="'Merriweather', Georgia, serif" font-size="28" font-weight="900" letter-spacing="1" text-anchor="middle">TEX-GLOBAL</text>
  <text x="200" y="148" fill="#ffffff" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">QUARTERLY INTELLIGENCE REVIEW</text>
  
  <line x1="50" y1="162" x2="350" y2="162" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Featured Issue Graphic Card -->
  <rect x="40" y="180" width="320" height="230" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  
  <rect x="60" y="198" width="120" height="22" rx="4" fill="#38bdf8"/>
  <text x="120" y="213" fill="#0f4c5c" font-family="'Noto Sans', Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SPECIAL EDITION</text>

  <text x="60" y="250" fill="#ffffff" font-family="'Merriweather', Georgia, serif" font-size="20" font-weight="700">INDIAN TEXTILE &amp;</text>
  <text x="60" y="278" fill="#ffffff" font-family="'Merriweather', Georgia, serif" font-size="20" font-weight="700">APPAREL SECTOR</text>
  <text x="60" y="306" fill="#38bdf8" font-family="'Merriweather', Georgia, serif" font-size="16" font-weight="700">COMPENDIUM 2024</text>

  <text x="60" y="340" fill="rgba(255,255,255,0.85)" font-family="'Noto Sans', Arial, sans-serif" font-size="10.5">• Global Export &amp; REX Trade Dynamics</text>
  <text x="60" y="360" fill="rgba(255,255,255,0.85)" font-family="'Noto Sans', Arial, sans-serif" font-size="10.5">• Handloom Mark &amp; Post-GI Value Addition</text>
  <text x="60" y="380" fill="rgba(255,255,255,0.85)" font-family="'Noto Sans', Arial, sans-serif" font-size="10.5">• Quality Control Orders (QCO) Compliance</text>

  <!-- Issue info bar -->
  <rect x="40" y="440" width="320" height="35" rx="4" fill="rgba(255,255,255,0.08)"/>
  <text x="55" y="462" fill="#ffffff" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="600">Vol. 16 • Issue 3 • Q3 2024</text>
  <text x="345" y="462" fill="#38bdf8" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">ISSN 2581-9984</text>

  <!-- Footer -->
  <text x="200" y="515" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans', Arial, sans-serif" font-size="10" text-anchor="middle">PUBLISHED BY TEXTILES COMMITTEE, GOVERNMENT OF INDIA</text>
</svg>
