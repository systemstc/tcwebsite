<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" width="400" height="568">
  <defs>
    <linearGradient id="bgReport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2e4b"/>
      <stop offset="60%" stop-color="#500d2e"/>
      <stop offset="100%" stop-color="#2b0416"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce38a"/>
      <stop offset="50%" stop-color="#e5b338"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="568" fill="url(#bgReport)"/>

  <!-- Left Spine Shadow Crease -->
  <rect x="0" y="0" width="18" height="568" fill="black" opacity="0.25"/>
  <line x1="18" y1="0" x2="18" y2="568" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Frame -->
  <rect x="25" y="22" width="350" height="524" fill="none" stroke="url(#goldGrad2)" stroke-width="2"/>
  <rect x="32" y="29" width="336" height="510" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Header -->
  <text x="200" y="70" fill="#fce38a" font-family="'Noto Sans', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">GOVERNMENT OF INDIA</text>
  <text x="200" y="86" fill="#ffffff" font-family="'Noto Sans', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">MINISTRY OF TEXTILES</text>

  <!-- Big Emblem circle -->
  <circle cx="200" cy="140" r="32" fill="#ffffff" stroke="url(#goldGrad2)" stroke-width="3"/>
  <path d="M 200,120 L 212,134 L 200,148 L 188,134 Z" fill="#6c1340"/>
  <circle cx="200" cy="140" r="8" fill="#b8860b"/>

  <text x="200" y="196" fill="#ffffff" font-family="'Noto Sans', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.5" text-anchor="middle">TEXTILES COMMITTEE</text>
  <text x="200" y="214" fill="#fce38a" font-family="'Noto Sans', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" text-anchor="middle">STATUTORY BODY UNDER ACT OF PARLIAMENT, 1963</text>

  <line x1="70" y1="230" x2="330" y2="230" stroke="url(#goldGrad2)" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="200" y="290" fill="#ffffff" font-family="'Merriweather', Georgia, serif" font-size="28" font-weight="900" text-anchor="middle">ANNUAL REPORT</text>
  <text x="200" y="325" fill="#fce38a" font-family="'Merriweather', Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">&amp; AUDITED ACCOUNTS</text>
  
  <!-- Year Banner -->
  <rect x="120" y="350" width="160" height="38" rx="6" fill="url(#goldGrad2)"/>
  <text x="200" y="375" fill="#1b2e4b" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle">2023 - 2024</text>

  <text x="200" y="420" fill="rgba(255,255,255,0.75)" font-family="'Noto Sans', Arial, sans-serif" font-size="10" text-anchor="middle">LAID ON THE TABLE OF BOTH HOUSES OF PARLIAMENT</text>

  <!-- Bottom Details -->
  <line x1="70" y1="460" x2="330" y2="460" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="200" y="490" fill="#fce38a" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">TEXTILES COMMITTEE, MUMBAI</text>
  <text x="200" y="508" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans', Arial, sans-serif" font-size="9.5" text-anchor="middle">Quality Assurance • Laboratory Testing • Export Certification</text>
</svg>
